services:
  - type: web
    name: walmart-cashback
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: walmart-cashback-db
          property: connectionString
    healthCheckPath: /

databases:
  - name: walmart-cashback-db
    plan: free