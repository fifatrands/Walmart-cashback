services:
  - type: web
    name: walmart-cashback
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && apt-get update && apt-get install -y tesseract-ocr poppler-utils"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: walmart-cashback-db
          property: connectionString
      - key: TESSDATA_PREFIX
        value: /usr/share/tesseract-ocr/5/tessdata
    healthCheckPath: /

databases:
  - name: walmart-cashback-db
    plan: free